name: 城市白图
description: 白色画布、黑灰路网与浅灰建筑肌理，以蓝色水系和绿色植被突出城市结构。
canvas:
  width: 4096
  height: 4096
  background: '#FFFFFF'
terrain:
  elevation_colors:
  - threshold: 0
    color: '#FFFFFF'
  mode: simple
  elevation_mode: stepped
  hillshade:
    enabled: false
    intensity: 0.3
    azimuth: 315.0
    altitude: 45.0
    large_scale_meters: 320.0
    small_scale_meters: 0.0
    large_scale_weight: 0.35
    small_scale_weight: 0.65
water:
  color: '#8CBAEA'
  border: '#8CBAEA'
  border_width: 0
built_area:
  enabled: true
  cell_meters: 8.0
  color: '#FCFCFC'
  buffer_meters: 60.0
  smooth_blur: 2.0
  smooth_iters: 6
  contour_upscale: 2
  edge_meters: 8.0
forest:
  color: '#ACD89B'
land_use:
  enabled: false
  detail: base
  cell_meters: 16.0
  smooth_blur: 1.5
  smooth_iters: 3
  contour_upscale: 2
  alpha: 110
  colors:
    green: '#ACD89B'
    public: '#FCFCFC'
    residential: '#FCFCFC'
    industrial: '#FCFCFC'
    office: '#FCFCFC'
    publictransport: '#FCFCFC'
    commercial: '#FCFCFC'
district:
  enabled: false
  border: '#C9CCCF'
  border_width:
    fixed: 1.0
    scaled: 0.5
  fill_alpha: 115
  fill_colors:
  - '#FCFCFC'
  smooth_blur: 1.0
  smooth_iters: 3
  contour_upscale: 2
zone:
  enabled: false
  border: '#C9CCCF'
  border_width: 0
  fill_alpha: 255
  fill: '#FCFCFC'
  smooth_blur: 1.0
  smooth_iters: 3
  contour_upscale: 2
roads:
  width_scale: 0.15
  highway:
    fill: '#454B50'
    border: '#454B50'
    border_width:
      fixed: 0.3
      scaled: 1.2
    min_fill_px: 1.8
  main:
    fill: '#62696E'
    border: '#62696E'
    border_width:
      fixed: 0.25
      scaled: 0.95
    min_fill_px: 1.4
  branch:
    fill: '#ADB2B6'
    border: '#ADB2B6'
    border_width:
      fixed: 0.15
      scaled: 0.65
    min_fill_px: 0.8
  special:
    fill: '#F8F9F8'
    border: '#C9CCCF'
    border_width:
      fixed: 0.15
      scaled: 0.65
    min_fill_px: 0.8
  beautification:
    fill: '#F3F4F3'
    border: '#D9DDDA'
    border_width:
      fixed: 0.1
      scaled: 0.4
    min_fill_px: 0.5
buildings:
  default: '#E1E4E2'
  border: '#BEC4C0'
  poi_tint:
    contrast: 0.38
  border_width:
    fixed: 0.2
    scaled: 0.6
  shadow:
    enabled: false
    offset:
    - 2
    - 2
    color: '#00000012'
  color_mode: uniform
procedural_objects:
  colors:
    geometry: '#F8F9F8'
    building: '#F8F9F8'
    prop: '#F8F9F8'
    tree: '#ACD89B'
    street_furn: '#F8F9F8'
    sign: '#F8F9F8'
    unknown: '#F8F9F8'
  border: '#C9CCCF'
  border_width:
    fixed: 0.2
    scaled: 0.7
  custom_color_alpha: 0.0
railway:
  train:
    line: '#747A7E'
    dash: '#FFFFFF'
  tram:
    line: '#ADB2B6'
    dash: '#FFFFFF'
  metro:
    line: '#ADB2B6'
    dash: '#FFFFFF'
  monorail:
    line: '#ADB2B6'
    dash: '#FFFFFF'
  cablecar:
    line: '#ADB2B6'
    dash: '#FFFFFF'
transports:
  enabled:
  - Metro
  - Train
  - Monorail
  - Tram
  - CableCar
  - Ship
  - Ferry
  - Bus
  - Trolleybus
  - Airplane
  - Helicopter
  auto_color: false
  width:
    fixed: 0.5
    scaled: 2.05
  smooth: 10
  transit_view:
    mask_intensity: 0.6
  types:
    Metro:
      width:
        fixed: 0.5
        scaled: 2.05
      dash: []
    Train:
      width:
        fixed: 0.5
        scaled: 2.2
      dash: []
    Monorail:
      width:
        fixed: 0.4
        scaled: 1.85
      dash: []
    Tram:
      width:
        fixed: 0.4
        scaled: 1.7
      dash: []
    CableCar:
      width:
        fixed: 0.4
        scaled: 1.7
      dash: []
    Ship:
      width:
        fixed: 0.45
        scaled: 1.875
      dash:
      - 8
      - 6
      color: '#3F7FBF'
    Ferry:
      width:
        fixed: 0.45
        scaled: 1.875
      dash:
      - 8
      - 6
      color: '#3F7FBF'
    Bus:
      width:
        fixed: 0.35
        scaled: 1.525
      dash: []
      color: '#5C6670'
    Trolleybus:
      width:
        fixed: 0.35
        scaled: 1.525
      dash:
      - 4
      - 4
      color: '#7C8590'
    Airplane:
      width:
        fixed: 0.4
        scaled: 1.7
      dash:
      - 10
      - 8
      color: '#8F98A6'
    Helicopter:
      width:
        fixed: 0.3
        scaled: 1.35
      dash:
      - 6
      - 6
      color: '#8F98A6'
  label:
    enabled: true
    font: SimHei
    min_zoom: 0.5
    size:
      fixed: 8.0
      scaled: 6.0
    padding:
      fixed: 5.0
      scaled: 3.5
    border_width:
      fixed: 0.9
      scaled: 0.6
    bg: '#FFFFFF'
    repeat_interval: 600
    min_gap: 350
    max_per_line: 4
poi_icons:
  enabled: true
  icons_dir: cn_icons
  icon_size:
    fixed: 20.0
    scaled: 4.0
  grid_size:
    fixed: 100.0
    scaled: 20.0
  max_per_cell: 2
  min_priority: 10
  bg_circle: false
  bg_circle_size:
    fixed: 28.0
    scaled: 6.0
  show_name: true
  name_size:
    fixed: 11.0
    scaled: 2.0
  name_offset: 3
  merge_enabled: true
  merge_distance: 48.0
  facility_hierarchy:
    enabled: true
    children_enabled: true
    child_min_zoom: 1.0
    area_labels_enabled: true
  transit_view_scale: 1.15
  categories: []
  hidden_categories:
  - traffic_light
  - highway_entrance
  - highway_exit
labels:
  district:
    font: PingFang SC
    size:
      fixed: 2.4
      scaled: 18.0
    color: '#555A5E'
    stroke: '#FFFFFF'
    stroke_width:
      fixed: 0.8
      scaled: 2.4
    bold: true
  road:
    font: PingFang SC
    size:
      fixed: 1.0
      scaled: 6.0
    color: '#555A5E'
    stroke: '#FFFFFF'
    stroke_width:
      fixed: 0.2
      scaled: 0.8
  building:
    font: PingFang SC
    size:
      fixed: 2.0
      scaled: 14.0
    color: '#555A5E'
  park:
    font: PingFang SC
    size:
      fixed: 2.0
      scaled: 12.0
    color: '#6F9361'
    stroke: '#FFFFFF'
    stroke_width: 1.5
  stop:
    font: PingFang SC
    size:
      fixed: 2.0
      scaled: 18.0
    color: '#555A5E'
watermark:
  enabled: true
  mod_name: CSLModernMap
  font: PingFang SC
  position: left_bottom
  font_size:
    fixed: 11
    scaled: 1.5
  separator: ' · '
  margin:
    x: 20
    y: 20
  padding:
    x: 12
    y: 6
  border_radius: 6
  background: transparent
  time_format: '%Y-%m-%d %H:%M:%S'
  city_color: '#555A5E'
  info_color: '#555A5E'
  meta_color: '#ADB2B6'
  content:
    mod_name: true
    city_name: true
    render_time: true
    style_name: true
    resolution: true
    traffic_time: true
    custom_text: false
