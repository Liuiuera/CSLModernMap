name: 卫星暖色
description: 暖色半透明道路与暖白标注，适合叠加卫星影像
canvas:
  width: 4096
  height: 4096
  background: '#F2F0E9'
terrain:
  elevation_colors:
  - threshold: 0
    color: '#F2F0E9'
  - threshold: 80
    color: '#F2F0E9'
  - threshold: 120
    color: '#E7E2D4'
  - threshold: 250
    color: '#DAD3BC'
  - threshold: 600
    color: '#C9BFA3'
  - threshold: 1200
    color: '#B0A88F'
  mode: simple
  elevation_mode: stepped
  hillshade:
    enabled: false
    intensity: 0.25
    azimuth: 315
    altitude: 45
    large_scale_meters: 320.0
    small_scale_meters: 0.0
    large_scale_weight: 0.35
    small_scale_weight: 0.65
water:
  color: '#A8D5E8'
  border: '#89BED6'
  border_width: 1
forest:
  color: '#CFE3B8'
land_use:
  enabled: true
  detail: base
  cell_meters: 16.0
  smooth_blur: 1.5
  smooth_iters: 3
  contour_upscale: 2
  alpha: 110
  colors:
    green: '#CFE3B8'
    public: '#E3DDD5'
    residential: '#F5D5A8'
    industrial: '#D5C3D8'
    office: '#A8C8E8'
    publictransport: '#A8D8C0'
    commercial: '#F5B8A0'
district:
  enabled: true
  border: '#A5A5A5'
  border_width:
    fixed: 1.0
    scaled: 0.5
  fill_alpha: 0
  fill_colors:
  - '#D9E8CC'
  - '#E8DCC8'
  - '#CCD8E8'
  - '#E8D4E8'
  - '#E8E8CC'
  - '#CCE8E8'
  - '#E8CCCC'
  - '#D4CCE8'
  smooth_blur: 1.0
  smooth_iters: 3
  contour_upscale: 2
zone:
  enabled: true
  border: '#B08A5C'
  border_width:
    fixed: 1.0
    scaled: 0.5
  fill_alpha: 0
  fill: '#C8C8C8'
  smooth_blur: 1.0
  smooth_iters: 3
  contour_upscale: 2
roads:
  width_scale: 0.15
  highway:
    fill: '#FFE1A8'
    border: '#49463E'
    min_fill_px: 1.8
    border_width: 0.6
  main:
    fill: '#FDE293'
    border: '#49463E'
    min_fill_px: 1.4
    border_width: 0.6
  special:
    fill: '#FFFFFF'
    border: '#49463E'
    min_fill_px: 0.8
    border_width: 0.6
  branch:
    fill: '#FFFFFF'
    border: '#49463E'
    min_fill_px: 0.8
    border_width: 0.6
  beautification:
    fill: '#F5F3EC'
    border: '#49463E'
    min_fill_px: 0.5
    border_width: 0.5
  opacity: 0.6
buildings:
  default: '#EFECE3'
  border: '#C9C5B8'
  border_width: 1
  shadow:
    enabled: true
    offset:
    - 2
    - 2
    color: '#00000018'
procedural_objects:
  colors:
    geometry: '#D9D7CC'
    building: '#E6E2D4'
    prop: '#DCD9CA'
    tree: '#A7CD8F'
    street_furn: '#D3D0C2'
    sign: '#E8B865'
    unknown: '#D8D5C7'
  border: '#B8B4A4'
  border_width: 0.9
  custom_color_alpha: 0.85
railway:
  train:
    line: '#DCDCDC'
    dash: '#6E6E6E'
transports:
  enabled:
  - Metro
  - Train
  - Monorail
  - Tram
  - CableCar
  - Ship
  - Ferry
  - Bus
  - Trolleybus
  - Airplane
  - Helicopter
  auto_color: false
  width:
    fixed: 0.5
    scaled: 2.05
  smooth: 10
  transit_view:
    mask_intensity: 0.6
  types:
    Metro:
      width:
        fixed: 0.5
        scaled: 2.05
      dash: []
    Train:
      width:
        fixed: 0.5
        scaled: 2.2
      dash: []
    Monorail:
      width:
        fixed: 0.4
        scaled: 1.85
      dash: []
    Tram:
      width:
        fixed: 0.4
        scaled: 1.7
      dash: []
    CableCar:
      width:
        fixed: 0.4
        scaled: 1.7
      dash: []
    Ship:
      width:
        fixed: 0.45
        scaled: 1.875
      dash:
      - 8
      - 6
      color: '#2E86AB'
    Ferry:
      width:
        fixed: 0.45
        scaled: 1.875
      dash:
      - 8
      - 6
      color: '#2E86AB'
    Bus:
      width:
        fixed: 0.35
        scaled: 1.525
      dash: []
      color: '#5A6472'
    Trolleybus:
      width:
        fixed: 0.35
        scaled: 1.525
      dash:
      - 4
      - 4
      color: '#7A8391'
    Airplane:
      width:
        fixed: 0.4
        scaled: 1.7
      dash:
      - 10
      - 8
      color: '#8A94A6'
    Helicopter:
      width:
        fixed: 0.3
        scaled: 1.35
      dash:
      - 6
      - 6
      color: '#8A94A6'
  label:
    enabled: true
    font: SimHei
    min_zoom: 0.5
    size:
      fixed: 8.0
      scaled: 6.0
    padding:
      fixed: 5.0
      scaled: 3.5
    border_width:
      fixed: 0.9
      scaled: 0.6
    bg: '#FFFFFF'
    repeat_interval: 600
    min_gap: 350
    max_per_line: 4
labels:
  district:
    font: SimHei
    size: 28
    color: '#F7F4EA'
    stroke: '#25231FBF'
    stroke_width:
      fixed: 1.5
      scaled: 0.0
    stroke_blur:
      fixed: 0.6
      scaled: 0.0
  road:
    font: SimHei
    size: 7
    color: '#F7F4EA'
    stroke: '#25231FBF'
    stroke_width:
      fixed: 1.2
      scaled: 0.0
    stroke_blur:
      fixed: 0.6
      scaled: 0.0
  building:
    font: SimHei
    size: 16
    color: '#F7F4EA'
  park:
    font: SimHei
    size: 14
    color: '#D6E8BF'
    stroke: '#25231F'
    stroke_width: 1.5
  stop:
    font: SimHei
    size: 20
    color: '#F7F4EA'
watermark:
  enabled: true
  mod_name: CSLModernMap
  position: left_bottom
  font_size:
    fixed: 11
    scaled: 1.5
  separator: ' · '
  margin:
    x: 20
    y: 20
  padding:
    x: 12
    y: 6
  border_radius: 6
  background: transparent
  time_format: '%Y-%m-%d %H:%M:%S'
  city_color: '#F7F4EA'
  info_color: '#F7F4EA'
  meta_color: '#D5D2CA'
  content:
    mod_name: true
    city_name: true
    render_time: true
    style_name: true
    resolution: true
    traffic_time: true
    custom_text: false
poi_icons:
  name_color: '#F7F4EA'
  name_stroke: '#25231F'
