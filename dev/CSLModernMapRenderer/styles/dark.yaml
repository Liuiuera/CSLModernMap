  enabled: true
  train:
    line: '#C8C8C8'
    dash: '#454545'
    pattern:
    - 2
    - 4
    width: 3.2
    station_width: 7.2
    dash_width: 2.0
  tram:
    line: '#B9A3C4'
    dash: '#F0F0F0'
    width: 3.2
    station_width: 7.2
    dash_width: 2.0
  metro:
    line:
      color: '#C39BCB'
      alpha: 200
    dash: '#F0F0F0'
    width: 3.2
    station_width: 7.2
    dash_width: 2.0
  monorail:
    line: '#B9A3C4'
    width: 3.2
    station_width: 7.2
    dash_width: 2.0
  cablecar:
    line: '#8E93A0'
    width: 3.2
    station_width: 7.2
    dash_width: 2.0
transports:
  enabled:
  - Metro
  - Train
  - Monorail
  - Tram
  - CableCar
  - Ship
  - Ferry
  - Bus
  - Trolleybus
  - Airplane
  - Helicopter
  auto_color: false
  width: 2.55
  smooth: 10
  transit_view:
    mask_intensity: 0.6
    label_size: 15.0
    label_merge_dist: 40.0
    label_candidate_interval: 110.0
    label_clearance_padding: 14.0
