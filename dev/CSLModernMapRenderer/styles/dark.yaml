      dash: []
    CableCar:
      width: 2.1
      dash: []
    Ship:
      width: 2.325
      dash:
      - 8.0
      - 6.0
      color: '#2E86AB'
    Ferry:
      width: 2.325
      dash:
      - 8.0
      - 6.0
      color: '#2E86AB'
    Bus:
      width: 1.875
      dash: []
      color: '#5A6472'
    Trolleybus:
      width: 1.875
      dash:
      - 4.0
      - 4.0
      color: '#7A8391'
    Airplane:
      width: 2.1
      dash:
      - 10.0
      - 8.0
      color: '#8A94A6'
    Helicopter:
      width: 1.6500000000000001
      dash:
      - 6.0
      - 6.0
      color: '#8A94A6'
  label:
    enabled: true
    font: SimHei
    min_zoom: 0.5
    size: 14.0
    padding: 8.5
    border_width: 1.5
    bg: '#FFFFFF'
    repeat_interval: 600.0
    min_gap: 350.0
    max_per_line: 4
    capture_padding: 3.0
    title_size: 76.0
    gap: 28.0
    column_gap: 84.0
    swatch_width: 132.0
    swatch_height: 48.0
    border_radius: 27.0
    margin: 70.0
    shadow_blur: 21.0
    shadow_offset: 10.0
  station:
    border_width: 2
    names:
      size: 11.0
      gap: 5.0
      stroke_width: 1.0
    diameter: 15.0
  line:
    light_outline:
      width: 2.4
labels:
  district:
    font: SimHei
    size: 28.0
    color: '#C8CDD2'
    stroke: '#1C1E22'
    stroke_width: 1.5
    stroke_blur: 0.0
  road:
    font: SimHei
    size: 7.0
    color: '#9A9EA4'
    stroke: '#1C1E22'
    stroke_width: 1.0
    stroke_blur: 0.0
    by_level:
      highway:
        size: 11.200000000000001
        stroke_width: 1.6
      main:
        size: 8.75
        stroke_width: 1.25
      special:
        size: 5.25
        stroke_width: 0.75
      beautification:
        size: 5.25
        stroke_width: 0.75
      quay:
        size: 5.25
        stroke_width: 0.75
  building:
    font: SimHei
    size: 16.0
    color: '#7A7E84'
  park:
    font: SimHei
    size: 14.0
    color: '#6E9E5E'
    stroke: '#FFFFFF'
    stroke_width: 1.5
  stop:
    font: SimHei
    size: 20.0
    color: '#4A9AE8'
  road_repeat: 400.0
  padding: 4.0
watermark:
  enabled: true
  mod_name: CSLModernMap
  position: left_bottom
  font_size: 12
  separator: ' · '
  margin:
    x: 20.0
    y: 20.0
  padding:
    x: 12.0
    y: 6.0
  border_radius: 6.0
  background: transparent
  time_format: '%Y-%m-%d %H:%M:%S'
  city_color: '#F0F0F0'
  info_color: '#C8CDD2'
  meta_color: '#8A8F96'
  content:
    mod_name: true
    city_name: true
    render_time: true
    style_name: true
    resolution: true
    traffic_time: true
    custom_text: false
satellite:
  preset: original
  intensity: 100
  quality: original
traffic:
  free: '#61A96A'
  slow: '#E6B54D'
  busy: '#D85B4A'
poi_icons:
  icon_size: 22.0
  bg_circle_size: 30.0
  name_size: 13.0
