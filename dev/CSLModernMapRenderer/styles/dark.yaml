    border: '#6B5F3E'
    border_width: 1.5
    line_width: 3.8
    footprint_scale: 1.0
  main:
    fill: '#3C3E44'
    border: '#5A5E66'
    border_width: 1.2
    line_width: 5.3
    footprint_scale: 1.0
