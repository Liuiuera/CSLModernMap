name: 暗黑风格
description: 深色底地图，适合夜间使用
canvas:
  width: 4096
  height: 4096
  background: '#1C1E22'
terrain:
  elevation_colors:
  - threshold: 0
    color: '#1C1E22'
  - threshold: 80
    color: '#1C1E22'
  - threshold: 120
    color: '#23262B'
  - threshold: 250
    color: '#2A2E34'
  - threshold: 600
    color: '#33383F'
  - threshold: 1200
    color: '#3E444C'
  mode: simple
  elevation_mode: stepped
  hillshade:
    enabled: false
    intensity: 0.3
    azimuth: 315
    altitude: 45
    large_scale_meters: 320.0
    small_scale_meters: 0.0
    large_scale_weight: 0.35
    small_scale_weight: 0.65
built_area:
  enabled: true
  cell_meters: 8.0
  buffer_meters: 60.0
  smooth_blur: 2.0
  smooth_iters: 6
  contour_upscale: 4
  color: '#1C1E22'
  exclude_services:
  - Electricity
  - Water
  - Road
  - Beautification
  include_parks: false
water:
  color: '#12293B'
  border: '#1D4057'
  border_width: 1.0
forest:
  color: '#1E2E1E'
land_use:
  enabled: true
  detail: base
  cell_meters: 16.0
  smooth_blur: 1.5
  smooth_iters: 3
  contour_upscale: 2
  alpha: 90
  colors:
    green: '#243B24'
    public: '#3A3A3A'
    residential: '#5C4A26'
    industrial: '#46324E'
    office: '#2C4258'
    publictransport: '#27453A'
    commercial: '#5C3326'
district:
  enabled: true
  border: '#8A8578'
  border_width: 1.5
  fill_alpha: 85
  fill_colors:
  - '#3A4640'
  - '#46403A'
  - '#3A404A'
  - '#463A44'
  - '#40463A'
  - '#3A4646'
  - '#46403F'
  - '#403A46'
  smooth_blur: 1.0
  smooth_iters: 3
  contour_upscale: 2
zone:
  enabled: true
  border: '#7A6A50'
  border_width: 1.5
  fill_alpha: 80
  fill: '#404040'
  smooth_blur: 1.0
  smooth_iters: 3
  contour_upscale: 2
