    geometry: '#35383E'
    building: '#2E3136'
    prop: '#323439'
    tree: '#2A4838'
    street_furn: '#3A3C40'
    sign: '#8A7130'
    unknown: '#34363B'
  border: '#484B50'
  border_width: 0.8
  custom_color_alpha: 0.85
