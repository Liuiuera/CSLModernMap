# RMP 生成参数。width 仅用于水域概括容差；原生样式由编辑器管理。
name: RMP 生成
transports:
  enabled:
  - Metro
  - Train
  - Monorail
  - Tram
  - CableCar
  - Ship
  - Ferry
  - Bus
  - Trolleybus
  width:
    fixed: 9.0
    scaled: 6.0
  schematic:
    spacing: 400
    adaptive:
      strength: 0.4
      max_compress: 0.6
      max_expand: 2.0
      dense_gap: 1
      dense_threshold: 0.45
  schematic_water:
    smoothing: 8.0
  grouping:
    by_name: true
    sequence_fallback: true
    share_ratio: 0.0
    merge_partial_overlap: false
    share_corridors: true
  station:
    merge_enabled: true
    merge_range: 48.0
    merge_bus_tram: true
    merge_train_metro: false
    facilities:
      enabled: true
      distances:
        airport: 1000
        rail: 600
        port: 600
      merge_distances:
        airport: 1200
        rail: 300
        port: 400
      offset:
        fixed: 24
        scaled: 9
