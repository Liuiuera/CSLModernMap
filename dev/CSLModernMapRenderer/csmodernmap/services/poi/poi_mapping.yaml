# POI 映射注册表
#
# 这是 POI 编辑器的核心数据文件。每个 BuildingAI 类型都有显式映射记录，
# 定义其对应的 POI 语义类型和图标。按建筑族分组，便于维护。
#
# 使用方式：
# 1. 游戏更新后运行 TypeInventoryExtractor 更新 building_type_inventory.yaml
# 2. 在此文件中添加新类型的映射
# 3. 新增图标时在 poi_kinds 中添加定义，并在对应图标库的
#    将新 icon_key 映射到精灵图坐标
#
# 显示策略：
#   visible       - 正常显示 POI
#   hidden        - 已识别但不显示（如系统性建筑）
#   inherit_parent - 附属建筑不单独显示，继承主建筑 POI
#
# 父建筑策略：
#   standalone    - 独立显示
#   inherit       - 有父建筑时继承，无父建筑时独立显示
#   sub_only      - 仅作为子建筑出现时才显示

schema_version: 1

# 当前导出器 icls=info.m_class.name，不是 m_buildingAI 的类型名。
# 按真实存档字段精确匹配；不使用名字子串、正则或全局默认分类。
