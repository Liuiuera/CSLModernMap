# 仅在真实 ParkGrid 归属已经确定后生效的窄范围兼容规则。
# 不得把同名对象在机场外的 Electricity Facility 全局改类。
area_overrides:
  - area_kind: airport
    name_exact: "Concourse Node Building"
    poi_kind: airport
    display: hidden
    parent: inherit

