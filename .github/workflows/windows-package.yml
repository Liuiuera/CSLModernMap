name: Windows package
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            dev/CSLModernMapRenderer/viewer/package-lock.json
            dev/third_party/rmp/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install build dependencies
        run: |
          python -m pip install -r dev/CSLModernMapRenderer/requirements-build.txt
          python -m pip install nuitka ordered-set zstandard
      - name: Build preview viewer
        run: python tools/renderer/build_preview_viewer.py
      - name: Test source
        run: |
          python tools/ci/check_docs.py
          python tools/ci/run_tests.py
      - name: Build and self-check compiled engine
        run: python dev/CSLModernMapRenderer/build_nuitka.py --mode standalone --skip-viewer
      - name: Assemble WinUI package
        run: python dev/CSLModernMapRenderer/winui/assemble.py --publish
      - name: Self-check assembled engine
        run: dev/CSLModernMapRenderer/dist/winui/CSLModernMapRenderer/engine/CSLModernMapEngine.exe self-check --report artifacts/packaged-self-check.json
      - name: Record build dependencies
        run: python -m pip freeze > artifacts/python-dependencies.txt
      - name: Package complete application
        run: python tools/release/package_windows.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
