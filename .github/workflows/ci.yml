name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_tests:
        description: Run the full regression suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  winui:
    name: WinUI build
    runs-on: windows-2025
    timeout-minutes: ${{ inputs.full_tests && 60 || 10 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dev/CSLModernMapRenderer/requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            dev/CSLModernMapRenderer/viewer/package-lock.json
            dev/third_party/rmp/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Check documentation links
        run: python tools/ci/check_docs.py
      - name: Install Python dependencies
        run: python -m pip install -r dev/CSLModernMapRenderer/requirements-build.txt
      - name: Build WinUI and embedded editors
        run: dotnet build dev/CSLModernMapRenderer/winui/CSLModernMapWinUI.csproj -c Release
      - name: Check engine resources
        run: python dev/CSLModernMapRenderer/main.py self-check --report artifacts/self-check.json
      - name: Test city loading, exports and engine protocol
        if: ${{ !inputs.full_tests }}
        run: python -m pytest -q tests/test_engine.py
      - name: Run full regression suite
        if: ${{ inputs.full_tests }}
        run: python tools/ci/run_tests.py
