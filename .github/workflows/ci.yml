name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dev/CSLModernMapRenderer/viewer/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r dev/CSLModernMapRenderer/requirements-build.txt
      - name: Check Python syntax
        run: python -m compileall -q dev/CSLModernMapRenderer tools tests
      - name: Check documentation links
        run: python tools/ci/check_docs.py
      - name: Build and type-check preview viewer
        run: python tools/renderer/build_preview_viewer.py
      - name: Check engine resources
        run: python dev/CSLModernMapRenderer/main.py self-check --report artifacts/self-check.json
      - name: Run integration tests
        run: python tools/ci/run_tests.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  winui:
    name: WinUI build
    needs: engine
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            dev/CSLModernMapRenderer/viewer/package-lock.json
            dev/third_party/rmp/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build WinUI and embedded editors
        run: dotnet build dev/CSLModernMapRenderer/winui/CSLModernMapWinUI.csproj -c Release
