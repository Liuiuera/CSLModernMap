name: macOS candidate acceptance (one-off)
on:
  push:
    branches: [acceptance/macos-native-20261124]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      CSLMM_MACOS_BUILD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            dev/CSLModernMapRenderer.macOS/requirements-macos13.lock
            dev/CSLModernMapRenderer.macOS/requirements-dmg.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            dev/CSLModernMapRenderer/viewer/package-lock.json
            dev/third_party/rmp/package-lock.json
      - name: Install macOS 13 Intel release dependencies
        run: |
          native=dev/CSLModernMapRenderer.macOS
          python -m pip install uv==0.12.16 -r "$native/requirements-dmg.lock"
          uv python install --no-bin --install-dir "$RUNNER_TEMP/cmm-runtime" 3.13.15
          runtime="$RUNNER_TEMP/cmm-runtime/cpython-3.13.15-macos-x86_64-none"
          test -x "$runtime/bin/python3.13"
          cat "$runtime/BUILD"
          "$runtime/bin/python3.13" "$native/scripts/install-release-deps.py" --target "$RUNNER_TEMP/release-deps"
      - name: Build normal viewer and RMP
        run: |
          (cd dev/CSLModernMapRenderer/viewer && npm ci && npm run typecheck && npm run build)
          (cd dev/third_party/rmp && npm ci && npm run build:embed)
          python dev/CSLModernMapRenderer.macOS/scripts/generate-winui-strings.py
          python dev/CSLModernMapRenderer.macOS/scripts/generate-native-localization.py
      - name: Package and audit slim production app
        run: |
          native=dev/CSLModernMapRenderer.macOS
          export CSLMM_WORKSPACE_DIR="$RUNNER_TEMP"
          out="$RUNNER_TEMP/cmm-candidate"
          mkdir -p "$out"
          export CSLMM_NATIVE_APP_DIR="$out/CSLModernMap Renderer.app"
          runtime="$RUNNER_TEMP/cmm-runtime/cpython-3.13.15-macos-x86_64-none"
          python "$native/scripts/package-app.py" --app-dir "$CSLMM_NATIVE_APP_DIR" --runtime "$runtime" --site-packages "$RUNNER_TEMP/release-deps"
          python "$native/scripts/audit-bundle.py" "$CSLMM_NATIVE_APP_DIR" --output "$out/audit.json"
          engine="$CSLMM_NATIVE_APP_DIR/Contents/Resources/engine"
          export PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1
          export CSLMM_NATIVE_DATA_DIR="$RUNNER_TEMP/cmm-package-data"
          unset PYTHONPATH PYTHONHOME
          "$engine/python/bin/python3.13" -c 'from PySide6.QtCore import QPointF; from PySide6.QtGui import QPainterPath, QPainterPathStroker; p=QPainterPath(QPointF(0,0)); p.lineTo(QPointF(3,4)); print(QPainterPathStroker().createStroke(p).boundingRect())'
          "$engine/python/bin/python3.13" "$engine/project/dev/CSLModernMapRenderer/main.py" self-check --report "$out/self-check.json"
          codesign --verify --deep --strict "$CSLMM_NATIVE_APP_DIR"
      - name: Build isolated probe using the slim production engine
        run: |
          native=dev/CSLModernMapRenderer.macOS
          export CSLMM_WORKSPACE_DIR="$RUNNER_TEMP"
          bash "$native/scripts/build-dev.sh" --with-checks
          probe="$RUNNER_TEMP/outputs/native-checks/CSLModernMap Renderer.app"
          app="$RUNNER_TEMP/cmm-candidate/CSLModernMap Renderer.app"
          check="$RUNNER_TEMP/probe/CSLModernMap Renderer.app"
          mkdir -p "$(dirname "$check")"
          ditto "$app" "$check"
          cp "$probe/Contents/MacOS/CSLModernMap" "$check/Contents/MacOS/CSLModernMap"
          /usr/libexec/PlistBuddy -c 'Set :CMMIntegrationChecks true' "$check/Contents/Info.plist"
          codesign --force --sign - "$check"
      - name: Run RMP acceptance with slim production runtime
        run: |
          echo "The hosted Intel runner loses the map's WebGL context. Physical Mac acceptance is still required for map camera and drafts."
          python - <<'PY'
          import json, os, pathlib, shutil, subprocess, sys
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-rmp-acceptance'
          out.mkdir()
          app = pathlib.Path(os.environ['RUNNER_TEMP']) / 'probe/CSLModernMap Renderer.app/Contents/MacOS/CSLModernMap'
          city = out / 'basan_rings.mmap'
          shutil.copy2('tests/renderer/fixtures/basan_rings.mmap', city)
          data = out / 'profile'
          data.mkdir()
          env = dict(os.environ, CSLMM_NATIVE_DATA_DIR=str(data), CSLMM_USER_DATA_DIR=str(data))
          with (out / 'app.log').open('w', encoding='utf-8') as log:
              subprocess.run([str(app), '--smoke', str(city), str(out), '--settings-probe', '--fgh-probe'], env=env, stdout=log, stderr=subprocess.STDOUT, timeout=300, check=True)
          report = json.loads((out / 'native-smoke.json').read_text())
          print(json.dumps({k: report.get(k) for k in ('success','checks','error')}, ensure_ascii=False), flush=True)
          if not report.get('success'):
              print((out / 'app.log').read_text(errors='replace')[-12000:])
              sys.exit(1)
          PY
      - name: Produce signed installer with original Finder layout
        run: |
          native=dev/CSLModernMapRenderer.macOS
          export CSLMM_WORKSPACE_DIR="$RUNNER_TEMP"
          out="$RUNNER_TEMP/cmm-candidate"
          export CSLMM_NATIVE_APP_DIR="$out/CSLModernMap Renderer.app"
          export CSLMM_DMG_PYTHON="$(command -v python)"
          bash "$native/scripts/make-dmg.sh"
          printf 'Product source: 037c9fea5e89a27905ee635df8762c438de8edfa\nAcceptance workflow commit: %s\nIntel x86_64, macOS 13+, ad-hoc signature, not notarized\nPhysical Mac WebGL acceptance still required\n' "$GITHUB_SHA" > "$out/build-info.txt"
      - name: Upload native acceptance logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-rmp-acceptance
          path: ${{ runner.temp }}/native-rmp-acceptance/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload candidate DMG and verification evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: CSLModernMap-6.7.4m-037c9fe-macOS13-x86_64-candidate
          path: |
            ${{ runner.temp }}/cmm-candidate/*.dmg
            ${{ runner.temp }}/cmm-candidate/*.dmg.sha256
            ${{ runner.temp }}/cmm-candidate/audit.json
            ${{ runner.temp }}/cmm-candidate/self-check.json
            ${{ runner.temp }}/cmm-candidate/app-build-manifest.json
            ${{ runner.temp }}/cmm-candidate/build-info.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
