name: macOS CI
on:
  push:
    branches: [main]
    paths:
      - 'dev/CSLModernMapRenderer/csmodernmap/**'
      - 'dev/CSLModernMapRenderer/viewer/**'
      - 'dev/CSLModernMapRenderer/resources/**'
      - 'dev/CSLModernMapRenderer/styles/**'
      - 'dev/CSLModernMapRenderer/main.py'
      - 'dev/CSLModernMapRenderer/winui/Strings/**'
      - 'dev/CSLModernMapRenderer.macOS/**'
      - 'dev/third_party/rmp/**'
      - 'assets/cn_icons/**'
      - 'tests/**'
      - 'version.json'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    paths:
      - 'dev/CSLModernMapRenderer/csmodernmap/**'
      - 'dev/CSLModernMapRenderer/viewer/**'
      - 'dev/CSLModernMapRenderer/resources/**'
      - 'dev/CSLModernMapRenderer/styles/**'
      - 'dev/CSLModernMapRenderer/main.py'
      - 'dev/CSLModernMapRenderer/winui/Strings/**'
      - 'dev/CSLModernMapRenderer.macOS/**'
      - 'dev/third_party/rmp/**'
      - 'assets/cn_icons/**'
      - 'tests/**'
      - 'version.json'
      - '.github/workflows/macos-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      CSLMM_MACOS_BUILD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: dev/CSLModernMapRenderer.macOS/requirements-macos13.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            dev/CSLModernMapRenderer/viewer/package-lock.json
            dev/third_party/rmp/package-lock.json
      - name: Install macOS engine dependencies
        run: python -m pip install -r dev/CSLModernMapRenderer.macOS/requirements-macos13.lock
      - name: Build shared viewer and editor
        run: |
          (cd dev/CSLModernMapRenderer/viewer && npm ci && npm run typecheck && npm run build)
          (cd dev/third_party/rmp && npm ci && npm run build:embed)
      - name: Generate and check translations
        run: |
          python dev/CSLModernMapRenderer.macOS/scripts/generate-winui-strings.py
          python dev/CSLModernMapRenderer.macOS/scripts/generate-native-localization.py
      - name: Build macOS client
        run: |
          export CSLMM_ENGINE_PYTHON="$(command -v python)"
          export CSLMM_WORKSPACE_DIR="$RUNNER_TEMP"
          bash dev/CSLModernMapRenderer.macOS/scripts/build-dev.sh
      - name: Engine and native smoke checks
        run: |
          export CSLMM_NATIVE_DATA_DIR="$RUNNER_TEMP/cmm-test-data"
          python -m pytest -q tests/test_engine.py tests/renderer/test_macos_legacy_settings.py tests/renderer/test_preview_export_sizing.py
          native=dev/CSLModernMapRenderer.macOS
          xcrun swiftc "$native/Sources/MapRangeBounds.swift" "$native/Tests/MapRangeChecks.swift" -o "$RUNNER_TEMP/map-range-checks"
          "$RUNNER_TEMP/map-range-checks"
          xcrun swiftc "$native/Sources/PreviewQuality.swift" "$native/Tests/PreviewQualityChecks.swift" -o "$RUNNER_TEMP/quality-checks"
          "$RUNNER_TEMP/quality-checks"
